; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:rpipico2w]
; NOTE: do not pin framework-arduinopico to 5.5.1 here. PlatformIO 6.2 /
; platform-raspberrypi 1.20 ships GCC 16, and framework 5.5.1 does not build
; against it (malloc-lock.cpp: __getreent not declared). Let the platform pick
; a matching framework, or pin both platform and framework to a known pair.
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
framework = arduino
board_build.core = earlephilhower
board = rpipico2w

board_build.bluetooth = on
build_flags =
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_BLUETOOTH
    ; The core's newlib is built without float printf unless this is forced.
    ; Without it every %f in Serial.printf prints nothing.
    -Wl,-u,_printf_float

monitor_speed = 115200

; Shared ASCEND CAN protocol + MCP2515 transport library.
lib_extra_dirs = ../common/lib

; Radiacode BLE is not used on this board. Remove this line if
; PNC_ENABLE_RADIACODE is ever set back to 1 in src/main.cpp.
lib_ignore = RadiaCodeBLELib

lib_deps =
	adafruit/RTClib@^2.1.4
	adafruit/Adafruit BME680 Library@^2.0.5
	sparkfun/SparkFun u-blox GNSS Arduino Library@^2.2.28
	adafruit/Adafruit INA260 Library@^1.5.3
	autowp/autowp-mcp2515@^1.3.1
